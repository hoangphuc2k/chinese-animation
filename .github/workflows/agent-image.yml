name: agent-image

# Builds the processing-agent image for the OCI ARM64 host and pushes it to your registry.
# Configure once in the repository settings:
#   variables: REGISTRY            e.g. registry.example.com/localizer
#   secrets:   REGISTRY_USERNAME, REGISTRY_PASSWORD
on:
  workflow_dispatch:
  push:
    tags:
      - "agent-v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --directory apps/processing-agent --frozen
      - run: uv run --directory apps/processing-agent pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Resolve registry host
        id: registry
        run: echo "host=${REGISTRY%%/*}" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ vars.REGISTRY }}
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.REGISTRY }}/localizer-agent
          tags: |
            type=sha,format=short
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: apps/processing-agent
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
