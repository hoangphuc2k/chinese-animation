name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate:local --workspace=@localizer/control-plane
      - run: npm run verify
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --directory apps/processing-agent --frozen
      - run: uv run --directory apps/processing-agent pytest -q
