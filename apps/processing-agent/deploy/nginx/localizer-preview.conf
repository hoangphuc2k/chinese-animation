# The authorization subrequest must validate Cloudflare Access, the opaque token,
# token expiry, and the requested job ID before Nginx receives this internal URI.
location /_localizer_preview/ {
    internal;
    alias /mnt/localizer/workspaces/;
    add_header Accept-Ranges bytes always;
    types { video/mp4 mp4; text/vtt vtt; application/x-subrip srt; }
}
