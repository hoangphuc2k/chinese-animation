# Portainer stack for the OCI processing plane (spec section 5.2).
# The control plane is NOT part of this stack: it runs as a Cloudflare Worker (deploy with wrangler).
# Values come from the Portainer stack environment; see stack.env.example and README.md.
name: localizer-processing

services:
  agent:
    image: ${REGISTRY:?Set REGISTRY to your registry and namespace}/localizer-agent:${AGENT_IMAGE_TAG:?Set AGENT_IMAGE_TAG to an immutable image tag}
    restart: unless-stopped
    environment:
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:?Set the Access-protected agent API origin}
      AGENT_ACCESS_CLIENT_ID: ${AGENT_ACCESS_CLIENT_ID:?Set the Access service-token client ID}
      AGENT_ACCESS_CLIENT_SECRET: ${AGENT_ACCESS_CLIENT_SECRET:?Set the Access service-token client secret}
      WORKSPACE_ROOT: /mnt/localizer/workspaces
      INBOX_ROOT: /mnt/localizer/inbox
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-5}
      HEARTBEAT_INTERVAL_SECONDS: ${HEARTBEAT_INTERVAL_SECONDS:-30}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-30}
      MAX_SOURCE_BYTES: ${MAX_SOURCE_BYTES:-21474836480}
      # Spec section 10: keep at least 20 GB free for active processing.
      MINIMUM_FREE_BYTES: ${MINIMUM_FREE_BYTES:-21474836480}
      # Transcription and rendering are core stages, so their pinned inputs are required.
      WHISPER_BINARY_PATH: /opt/localizer/bin/whisper-cli
      WHISPER_BINARY_VERSION: whisper.cpp-1.7.4
      WHISPER_MODEL_PATH: /opt/localizer/models/${WHISPER_MODEL_FILE:-ggml-small-q5_1.bin}
      WHISPER_MODEL_SHA256: ${WHISPER_MODEL_SHA256:?Set the lowercase SHA-256 of the whisper model}
      WATERMARK_PATH: /opt/localizer/assets/${WATERMARK_FILE:-watermark.png}
      WATERMARK_SHA256: ${WATERMARK_SHA256:?Set the lowercase SHA-256 of the watermark PNG}
      # Optional providers: leave all three of a provider empty to disable its stage.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-}
      GEMINI_MODEL_ID: ${GEMINI_MODEL_ID:-}
      AZURE_SPEECH_ENDPOINT: ${AZURE_SPEECH_ENDPOINT:-}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_VOICE: ${AZURE_SPEECH_VOICE:-}
    volumes:
      # Host directories must be owned by UID/GID 10001 (the image's agent user).
      - ${LOCALIZER_DATA_ROOT:-/mnt/localizer}/workspaces:/mnt/localizer/workspaces
      # Creator files are delivered here over Bastion/SCP; the agent only reads them.
      - ${LOCALIZER_DATA_ROOT:-/mnt/localizer}/inbox:/mnt/localizer/inbox:ro
      - ${LOCALIZER_DATA_ROOT:-/mnt/localizer}/models:/opt/localizer/models:ro
      - ${LOCALIZER_DATA_ROOT:-/mnt/localizer}/assets:/opt/localizer/assets:ro
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Spec section 16: one CPU-heavy job, peak memory below 10 GB on the 2 OCPU / 12 GB shape.
    cpus: ${AGENT_CPUS:-2}
    mem_limit: ${AGENT_MEMORY_LIMIT:-10g}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
